<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CareerNexus Portals</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="portal.css"></head><body><div class="app"><aside><a class="brand" href="index.html"><b>CN</b> Career<span>Nexus</span></a><div class="role-tabs"><button class="active" data-role="recruiter">🏢 Recruiter</button><button data-role="admin">🛡️ Super Admin</button></div><nav><button data-page="overview">▦ Overview</button><button data-page="companies">▣ Companies</button><button data-page="jobs">◫ Job Posts</button><button data-page="drives">◉ Placement Drives</button><button data-page="applicants">♙ Applicants</button><button data-page="analytics">◌ Analytics</button></nav><a class="back" href="index.html">← Back to CareerNexus</a></aside><main><header><div><small id="roleLabel">Recruiter Workspace</small><h1 id="pageTitle">Recruiter Dashboard</h1></div><div class="head-actions"><span class="notification" onclick="showLiveNotifications()">🔔 <i id="liveNotificationCount">0</i></span><div class="user"><span id="userAvatar">AR</span><div><b id="userName">Acme Recruiter</b><small>Verified account</small></div></div></div></header><div id="content"></div></main></div><div id="modal" class="modal hidden"></div><div id="toast" class="toast"></div><script src="sync.js"></script><script src="integration.js"></script><script src="portal.js"></script><script>function showLiveNotifications(){const d=cnLoad();const notes=d.notifications.slice(0,8);modal('Live Notifications',notes.map(n=>'<div class="check">🔔 <span>'+n.text+'</span></div>').join('')||'<p class="muted">No notifications.</p>')}function refreshLive(){document.getElementById('liveNotificationCount').textContent=cnLoad().notifications.filter(n=>!n.read).length}window.addEventListener('careernexus-sync',refreshLive);window.addEventListener('storage',refreshLive);refreshLive();const r=new URLSearchParams(location.search).get('role');if(r==='Super Admin'||r==='Placement Officer')setTimeout(()=>document.querySelector('[data-role="admin"]').click(),0);</script></body></html>
